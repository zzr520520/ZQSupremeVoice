name: Build Dylib & Sign IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Compile arm64 Dylib
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -fobjc-arc -O2 \
            PatchZQ.m -o libPatchZQ.dylib

          install_name_tool -id "@rpath/libPatchZQ.dylib" libPatchZQ.dylib
          strip -x libPatchZQ.dylib
          ls -lh libPatchZQ.dylib
          file libPatchZQ.dylib
          echo "=== 导出符号 ==="
          nm -gU libPatchZQ.dylib | head -20
          echo "=== 依赖库 ==="
          otool -L libPatchZQ.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libPatchZQ
          path: libPatchZQ.dylib

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: libPatchZQ.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install zsign
        run: |
          brew install zsign || true
          zsign -v 2>&1 || echo "zsign not available"

      - name: Check signing config
        id: check
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ] && [ -n "${{ secrets.IPA_URL }}" ]; then
            echo "has_sign_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign_config=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 secrets，跳过重签名"
          fi

      - name: Download IPA
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          curl -L -o app.ipa "${{ secrets.IPA_URL }}"
          ls -lh app.ipa

      - name: Strip ZSE & Inject dylib
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          unzip -q app.ipa -d Payload_Dir
          APP_PATH=$(find Payload_Dir/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"

          APP_BINARY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || basename "$APP_PATH" .app)
          echo "Binary: $APP_BINARY"

          echo ""
          echo "=== Frameworks ==="
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "(none)"

          # ---- 方案A：剥离 ZSE.framework ----
          if [ -d "$APP_PATH/Frameworks/ZSE.framework" ]; then
            echo ""
            echo ">>> 发现 ZSE.framework，开始剥离..."
            python3 remove_dylib_dep.py "$APP_PATH/$APP_BINARY" "ZSE" || true
            rm -rf "$APP_PATH/Frameworks/ZSE.framework"
            echo "ZSE.framework 已删除"
          else
            echo "未找到 ZSE.framework"
          fi

          # ---- 清理历史 dylib 残留 ----
          rm -f "$APP_PATH"/libPatchZQ*.dylib 2>/dev/null || true
          rm -f "$APP_PATH/Frameworks"/libPatchZQ*.dylib 2>/dev/null || true
          echo ""
          echo "已清理历史 dylib 残留"

          # ---- 注入补丁 dylib ----
          mkdir -p "$APP_PATH/Frameworks"
          cp libPatchZQ.dylib "$APP_PATH/Frameworks/libPatchZQ.dylib"
          python3 insert_dylib.py "$APP_PATH/$APP_BINARY" "@rpath/libPatchZQ.dylib"
          echo "Dylib 注入完成"

          echo ""
          echo "=== 验证注入 ==="
          otool -L "$APP_PATH/$APP_BINARY" | grep -i patch || echo "(未找到)"

          # ---- 清理冲突组件 ----
          rm -rf "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/Watch"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -rf "$APP_PATH/SC_Info"
          # 保留 embedded.mobileprovision（由 dylib C 层拦截 open/stat）
          find "$APP_PATH/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          echo ""
          echo "=== 最终 App 大小 ==="
          du -sh "$APP_PATH"

      - name: Sign IPA with zsign
        if: steps.check.outputs.has_sign_config == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROV_BASE64" | base64 -d > profile.mobileprovision

          APP_PATH=$(find Payload_Dir/Payload -name "*.app" -maxdepth 1 | head -1)

          zsign -f -k cert.p12 -p "$P12_PASSWORD" -m profile.mobileprovision \
            -o signed_output.ipa "$APP_PATH"

          ls -lh signed_output.ipa

      - name: Upload Signed IPA
        if: steps.check.outputs.has_sign_config == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Signed-IPA
          path: signed_output.ipa
