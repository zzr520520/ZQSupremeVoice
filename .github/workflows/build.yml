name: Pure Binary Patch & Sign IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'patch_engine.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-sign:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Tooling
        run: |
          brew install zsign || true

      - name: Check signing config
        id: check
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ] && [ -n "${{ secrets.IPA_URL }}" ] && [ -n "${{ secrets.PROVISION_BASE64 }}" ]; then
            echo "has_sign_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign_config=false" >> "$GITHUB_OUTPUT"
            echo "未配置完整签名 secrets（需要 P12_BASE64, IPA_URL, PROVISION_BASE64）"
          fi

      - name: Download Original IPA
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          rm -rf Payload_Workspace Signed_Final.ipa original.ipa
          curl -L -o original.ipa "${{ secrets.IPA_URL }}"
          ls -lh original.ipa

      - name: Prepare Clean IPA
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          rm -rf Payload_Workspace
          unzip -q original.ipa -d Payload_Workspace
          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)
          APP_BINARY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || basename "$APP_PATH" .app)
          echo "App: $APP_PATH"
          echo "Binary: $APP_BINARY"
          echo "原 BundleID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist' 2>/dev/null || echo 'unknown')"

          # 清理个人证书无法签名的插件与扩展
          rm -rf "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/Watch"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -rf "$APP_PATH/SC_Info"
          rm -f "$APP_PATH/embedded.mobileprovision"
          find "$APP_PATH/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          # 清理所有历史 Dylib 残留（虽然新版本不注入，但防止旧 IPA 里有）
          find "$APP_PATH" -iname "*patchzq*" -type f -delete 2>/dev/null || true
          find "$APP_PATH" -iname "libpatch*" -type f -delete 2>/dev/null || true
          find "$APP_PATH" -iname "*supreme*" -type f -delete 2>/dev/null || true

      - name: Static Engine Patch (主二进制)
        if: steps.check.outputs.has_sign_config == 'true'
        env:
          PROV_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          echo "$PROV_BASE64" | base64 -d > profile.mobileprovision

          # 从 .mobileprovision 中提取个人证书的真实 Team ID
          TEAM_ID=$(security cms -D -i profile.mobileprovision 2>/dev/null | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "")
          if [ -z "$TEAM_ID" ] || [ ${#TEAM_ID} -ne 10 ]; then
            echo "❌ 无法从 mobileprovision 提取有效的 10 位 Team ID"
            exit 1
          fi
          echo "✅ 个人证书 Team ID: $TEAM_ID"

          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)
          APP_BINARY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || basename "$APP_PATH" .app)

          echo ""
          echo "=== 修补主二进制 ==="
          python3 patch_engine.py "$APP_PATH/$APP_BINARY" "$TEAM_ID"

      - name: Sign IPA with zsign
        if: steps.check.outputs.has_sign_config == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROV_BASE64" | base64 -d > profile.mobileprovision

          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)

          # 重签：锁定原包名 com.zhenqu.music，不修改 bundle id
          zsign -f -b "com.zhenqu.music" \
            -k cert.p12 -p "$P12_PASSWORD" -m profile.mobileprovision \
            -o Signed_Final.ipa "$APP_PATH"

          ls -lh Signed_Final.ipa

      - name: Upload Signed IPA
        if: steps.check.outputs.has_sign_config == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Signed-ZQMusic
          path: Signed_Final.ipa
