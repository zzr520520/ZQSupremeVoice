name: Build Dylib & Clean Sign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Compile Minimal Dylib
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -fobjc-arc -O2 \
            PatchZQ.m -o libPatchZQ.dylib

          install_name_tool -id "@rpath/libPatchZQ.dylib" libPatchZQ.dylib
          strip -x libPatchZQ.dylib
          ls -lh libPatchZQ.dylib
          file libPatchZQ.dylib
          echo "=== 导出符号 ==="
          nm -gU libPatchZQ.dylib
          echo "=== 依赖库 ==="
          otool -L libPatchZQ.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libPatchZQ
          path: libPatchZQ.dylib

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: libPatchZQ.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install zsign
        run: |
          brew install zsign || true
          zsign -h 2>&1 | head -10 || echo "zsign not available"

      - name: Check signing config
        id: check
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ] && [ -n "${{ secrets.IPA_URL }}" ]; then
            echo "has_sign_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign_config=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 secrets，跳过重签名"
          fi

      - name: Download Original IPA
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          rm -rf Payload_Workspace Signed_ZQMusic.ipa original.ipa
          curl -L -o original.ipa "${{ secrets.IPA_URL }}"
          ls -lh original.ipa

      - name: Clean Inject (从原始 IPA 全新注入)
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          # 每次全新解压，绝不复用已有 Payload，防止累积
          rm -rf Payload_Workspace
          unzip -q original.ipa -d Payload_Workspace
          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"

          APP_BINARY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || basename "$APP_PATH" .app)
          echo "Binary: $APP_BINARY"
          echo "原 BundleID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || echo 'unknown')"

          echo ""
          echo "=== 原始 Frameworks ==="
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "(none)"

          # ---- 确认原始 IPA 不含 PatchZQ（干净输入）----
          if find "$APP_PATH" -name "*PatchZQ*" -type f | grep -q .; then
            echo "警告：原始 IPA 中已存在 PatchZQ，正在清理..."
            find "$APP_PATH" -name "*PatchZQ*" -type f -print -delete
          else
            echo "原始 IPA 干净，无 PatchZQ 残留"
          fi

          # ---- 剥离 ZSE.framework（可选）----
          if [ -d "$APP_PATH/Frameworks/ZSE.framework" ]; then
            echo ""
            echo ">>> 剥离 ZSE.framework..."
            python3 remove_dylib_dep.py "$APP_PATH/$APP_BINARY" "ZSE" || true
            rm -rf "$APP_PATH/Frameworks/ZSE.framework"
            echo "ZSE.framework 已删除"
          fi

          # ---- 注入单一干净 dylib ----
          mkdir -p "$APP_PATH/Frameworks"
          cp libPatchZQ.dylib "$APP_PATH/Frameworks/libPatchZQ.dylib"
          python3 insert_dylib.py "$APP_PATH/$APP_BINARY" "@rpath/libPatchZQ.dylib"
          echo ""
          echo "Dylib 注入完成"

          echo ""
          echo "=== 验证（确保只有一个 PatchZQ）==="
          PATCH_COUNT=$(find "$APP_PATH" -name "*PatchZQ*" -type f | wc -l)
          echo "PatchZQ 文件数: $PATCH_COUNT"
          otool -L "$APP_PATH/$APP_BINARY" | grep -i patch || echo "(未找到 patch dylib)"

          # ---- 清理冲突组件（保留 Assets.car 和所有资源完整）----
          rm -rf "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/Watch"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -rf "$APP_PATH/SC_Info"
          find "$APP_PATH/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          # embedded.mobileprovision 保留（由信号捕获防护自毁）

          echo ""
          echo "=== 最终目录大小 ==="
          du -sh "$APP_PATH"
          du -sh "$APP_PATH/Assets.car" 2>/dev/null || echo "(无 Assets.car)"

      - name: Sign IPA with zsign (-b 强制原包名)
        if: steps.check.outputs.has_sign_config == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROV_BASE64" | base64 -d > profile.mobileprovision

          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)

          # -f 强制全量覆盖签名
          # -b 强制保持原包名 com.zhenqu.music
          zsign -f -b "com.zhenqu.music" \
            -k cert.p12 -p "$P12_PASSWORD" -m profile.mobileprovision \
            -o Signed_ZQMusic.ipa "$APP_PATH"

          ls -lh Signed_ZQMusic.ipa

      - name: Upload Signed IPA
        if: steps.check.outputs.has_sign_config == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Signed-ZQMusic
          path: Signed_ZQMusic.ipa
