name: Build Dylib & Clean Sign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Tooling
        run: |
          brew install zsign || true
          brew install optool || true

      - name: Compile Patch Dylib
        run: |
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -fobjc-arc -O2 \
            PatchZQ.m -o libPatchZQ.dylib

          install_name_tool -id "@executable_path/libPatchZQ.dylib" libPatchZQ.dylib
          strip -x libPatchZQ.dylib
          ls -lh libPatchZQ.dylib
          file libPatchZQ.dylib

          echo "=== 验证 __interpose 段 ==="
          otool -l libPatchZQ.dylib | grep -A4 __interpose || echo "(未找到 __interpose 段！)"

          echo "=== 依赖库 ==="
          otool -L libPatchZQ.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libPatchZQ
          path: libPatchZQ.dylib

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: libPatchZQ.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check signing config
        id: check
        run: |
          if [ -n "${{ secrets.P12_BASE64 }}" ] && [ -n "${{ secrets.IPA_URL }}" ]; then
            echo "has_sign_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sign_config=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 secrets，跳过重签名"
          fi

      - name: Download Original IPA
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          rm -rf Payload_Workspace Signed_Final.ipa original.ipa
          curl -L -o original.ipa "${{ secrets.IPA_URL }}"
          ls -lh original.ipa

      - name: Clean Inject (从原始 IPA 全新注入)
        if: steps.check.outputs.has_sign_config == 'true'
        run: |
          rm -rf Payload_Workspace
          unzip -q original.ipa -d Payload_Workspace
          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)
          echo "App: $APP_PATH"

          APP_BINARY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || basename "$APP_PATH" .app)
          echo "Binary: $APP_BINARY"
          echo "原 BundleID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || echo 'unknown')"

          echo ""
          echo "=== 清理所有历史注入 ==="
          # 删除所有历史 PatchZQ 文件（包括子目录）
          find "$APP_PATH" -name "*PatchZQ*" -type f -print -delete 2>/dev/null || true
          rm -f "$APP_PATH"/libPatchZQ*.dylib
          # 删除所有带编号的历史 dylib（如 libPatchZQ 2.dylib, libPatchZQ 3.dylib 等）
          find "$APP_PATH" -name "libPatchZQ*" -type f -print -delete 2>/dev/null || true

          # 检查并清理已存在的 Load Command
          echo "=== 清理旧 Load Command ==="
          EXISTING_LC=$(otool -L "$APP_PATH/$APP_BINARY" | grep -ci "patchzq" || echo "0")
          if [ "$EXISTING_LC" -gt 0 ]; then
            echo "发现 $EXISTING_LC 个旧 PatchZQ Load Command，正在清理..."
            # 用 optool uninstall 逐个移除
            optool uninstall -p "@executable_path/libPatchZQ.dylib" -t "$APP_PATH/$APP_BINARY" 2>/dev/null || true
            for i in 2 3 4 5 6 7 8 9; do
              optool uninstall -p "@executable_path/libPatchZQ $i.dylib" -t "$APP_PATH/$APP_BINARY" 2>/dev/null || true
            done
          else
            echo "原始 IPA 无 PatchZQ Load Command"
          fi

          # ---- 剥离 ZSE.framework（如果存在）----
          if [ -d "$APP_PATH/Frameworks/ZSE.framework" ]; then
            echo ""
            echo ">>> 剥离 ZSE.framework..."
            python3 remove_dylib_dep.py "$APP_PATH/$APP_BINARY" "ZSE" || true
            rm -rf "$APP_PATH/Frameworks/ZSE.framework"
            echo "ZSE.framework 已删除"
          fi

          # ---- 拷贝单一干净 dylib 到 .app 根目录 ----
          cp libPatchZQ.dylib "$APP_PATH/libPatchZQ.dylib"

          # ---- 用 optool 写入 Load Command ----
          optool install -c load \
            -p "@executable_path/libPatchZQ.dylib" \
            -t "$APP_PATH/$APP_BINARY"

          echo ""
          echo "=== 验证注入（确保只有一个 PatchZQ）==="
          LC_COUNT=$(otool -L "$APP_PATH/$APP_BINARY" | grep -ci "patchzq" || echo "0")
          echo "PatchZQ Load Command 数: $LC_COUNT"
          FILE_COUNT=$(find "$APP_PATH" -name "*PatchZQ*" -type f | wc -l)
          echo "PatchZQ 文件数: $FILE_COUNT"
          if [ "$LC_COUNT" -ne 1 ] || [ "$FILE_COUNT" -ne 1 ]; then
            echo "错误：PatchZQ 注入异常！LC=$LC_COUNT FILE=$FILE_COUNT"
            exit 1
          fi
          echo "注入验证通过：仅 1 个 Load Command + 1 个文件"

          # ---- 清理所有扩展和可能引发证书权限冲突的签名残留 ----
          rm -rf "$APP_PATH/PlugIns"
          rm -rf "$APP_PATH/Watch"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -rf "$APP_PATH/SC_Info"
          rm -f "$APP_PATH/embedded.mobileprovision"
          find "$APP_PATH/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          echo ""
          echo "=== 最终目录大小 ==="
          du -sh "$APP_PATH"

      - name: Sign IPA with zsign (-b 强制原包名)
        if: steps.check.outputs.has_sign_config == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          echo "$P12_BASE64" | base64 -d > cert.p12
          echo "$PROV_BASE64" | base64 -d > profile.mobileprovision

          APP_PATH=$(find Payload_Workspace/Payload -name "*.app" -maxdepth 1 | head -1)

          # 强制覆盖签名并锁定原包名
          zsign -f -b "com.zhenqu.music" \
            -k cert.p12 -p "$P12_PASSWORD" -m profile.mobileprovision \
            -o Signed_Final.ipa "$APP_PATH"

          ls -lh Signed_Final.ipa

      - name: Upload Signed IPA
        if: steps.check.outputs.has_sign_config == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Final-ZQMusic
          path: Signed_Final.ipa
